<!DOCTYPE html>
<html>
<head>
    <title>Library Books List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 50px;
        }

        h2 {
            color: #007bff;
        }

        .table {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .table th, .table td {
            padding: 20px;
            text-align: center;
        }

        .table th {
            background-color: #007bff;
            color: white;
            font-size: 1.1rem;
        }

        .table td {
            background-color: #f1f1f1;
            color: #333;
        }

        .table-hover tbody tr:hover {
            background-color: #f0f8ff;
        }

        .btn-sm {
            padding: 0.4rem 0.6rem;
        }

        .btn-warning {
            background-color: #ffc107;
            border-color: #ffc107;
        }

        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }

        .btn-sm:hover {
            transform: scale(1.05);
            transition: 0.3s ease;
        }

        .mb-4 {
            margin-bottom: 30px;
        }

        .table-container {
            max-height: 500px;
            overflow-y: scroll;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-center flex-grow-1">📚 All Library Books 📚</h2>
            <div>
              <a href="{{ url_for('add_book') }}" class="btn btn-primary me-2">+ Add New Book</a>
              <a href="{{ url_for('book_report') }}" class="btn btn-success">📊 Generate Report</a>
            </div>
        </div>

        <div class="table-container">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Publisher</th>
                        <th>Genre</th>
                        <th>Published Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                  {% for book in books %}
                    <tr>
                        <td>{{ book.title }}</td>
                        <td>{{ book.author.name }}</td>
                        <td>{{ book.publisher.name }}</td>
                        <td>{{ book.genre }}</td>
                        <td>{{ book.published_date.strftime('%Y-%m-%d') }}</td>
                        <td>
                            <a href="{{ url_for('edit_book', id=book.book_id) }}" class="btn btn-warning btn-sm">Edit</a>
                            <form action="{{ url_for('delete_book', id=book.book_id) }}" method="POST" style="display:inline;">
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </td>
                    </tr>
                  {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
