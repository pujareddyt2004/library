<!DOCTYPE html>
<html>
<head>
    <title>Edit Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            margin-top: 50px;
        }

        h2 {
            color: #007bff;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        .form-control, .form-select {
            border-radius: 5px;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            padding: 12px 20px;
            font-size: 1.1rem;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
            transition: background-color 0.3s ease;
        }

        .mb-4 {
            margin-bottom: 20px;
        }

        .mb-3 {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-control, .form-select {
            padding: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Edit Book</h2>
        <div class="form-container">
            <form method="POST">
                <div class="mb-3">
                    <label for="title">Title:</label>
                    <input type="text" name="title" id="title" value="{{ book.title }}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="genre">Genre:</label>
                    <input type="text" name="genre" id="genre" value="{{ book.genre }}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="published_date">Published Date:</label>
                    <input type="date" name="published_date" id="published_date" value="{{ book.published_date.strftime('%Y-%m-%d') }}" class="form-control" required>
                </div>

                <div class="mb-3">
                  <label>Author:</label>
                  <select name="author" class="form-select">
                      {% for author in authors %}
                          <option value="{{ author.author_id }}" {% if author.author_id == book.author_id %}selected{% endif %}>{{ author.name }}</option>
                      {% endfor %}
                  </select>
              </div>
              
              <div class="mb-3">
                  <label>Publisher:</label>
                  <select name="publisher" class="form-select">
                      {% for publisher in publishers %}
                          <option value="{{ publisher.publisher_id }}" {% if publisher.publisher_id == book.publisher_id %}selected{% endif %}>{{ publisher.name }}</option>
                      {% endfor %}
                  </select>
              </div>

                <button type="submit" class="btn btn-primary btn-block">Update Book</button>
            </form>
        </div>
    </div>
</body>
</html>
