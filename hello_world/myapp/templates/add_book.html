<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add New Book</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .container {
      margin-top: 50px;
    }
    h2 {
      color: #007bff;
      text-align: center;
      margin-bottom: 30px;
    }
    .form-container {
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 30px;
    }
    label {
      font-weight: bold;
    }
    .form-control, .form-select {
      border-radius: 5px;
      padding: 15px;
      font-size: 1rem;
      margin-bottom: 20px;
    }
    .btn-success {
      background-color: #28a745;
      border-color: #28a745;
      padding: 12px 20px;
      font-size: 1.1rem;
      width: 100%;
    }
    .btn-success:hover {
      background-color: #218838;
      border-color: #1e7e34;
      transition: background-color 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Add New Book</h2>
    <div class="form-container">
      <form method="POST">
        <div>
          <label for="title">Title:</label>
          <input type="text" name="title" id="title" class="form-control" required>
        </div>

        <div>
          <label for="genre">Genre:</label>
          <input type="text" name="genre" id="genre" class="form-control" required>
        </div>

        <div>
          <label for="published_date">Published Date:</label>
          <input type="date" name="published_date" id="published_date" class="form-control" required>
        </div>

        <div>
          <label for="author">Author:</label>
          <select name="author" id="author" class="form-select" required>
            <option value="" disabled selected>Select an author</option>
            {% for author in authors %}
              <option value="{{ author.author_id }}">{{ author.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div>
          <label for="publisher">Publisher:</label>
          <select name="publisher" id="publisher" class="form-select" required>
            <option value="" disabled selected>Select a publisher</option>
            {% for publisher in publishers %}
              <option value="{{ publisher.publisher_id }}">{{ publisher.name }}</option>
            {% endfor %}
          </select>
        </div>

        <button type="submit" class="btn btn-success">Add Book</button>
      </form>
    </div>
  </div>
</body>
</html>
